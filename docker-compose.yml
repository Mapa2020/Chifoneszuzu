services:
  db:
    image: mysql:8.0
    container_name: zuzu_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - zuzu_db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: zuzu_backend
    restart: always
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      - DB_HOST=db
      - BACKEND_PORT=3001
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: zuzu_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend

volumes:
  zuzu_db_data:
