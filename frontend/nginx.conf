server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para las llamadas a la API hacia el contenedor backend
    location /api {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }
}
